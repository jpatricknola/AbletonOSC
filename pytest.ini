#--------------------------------------------------------------------------------
# Bare `pytest` from the repository root runs the Live-free gate and nothing
# else. tests/ is the opt-in live-integration suite: it needs a running Ableton
# Live, mutates the open set, and binds the OSC reply port, so it is never
# collected by accident. Run it deliberately, and only deliberately:
#
#     ABLETONOSC_LIVE_TESTS=1 python3 -m pytest tests/
#
# An explicit path argument overrides testpaths, so `pytest tests/` still works;
# without the environment variable every test in it skips.
#--------------------------------------------------------------------------------
[pytest]
testpaths = tests_unit
